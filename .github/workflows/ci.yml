name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    name: Privacy & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository for secrets and PII
        run: python scripts/security_scan.py --root . --md security-scan.md

  examples:
    name: Front-end example spec compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every example against the web spec
        run: |
          set +e
          python scripts/verify_example.py --all --md example-verification.md
          status=$?
          set -e
          # 0 = clean, 1 = errors (fail the build), 2 = warnings only (tolerated)
          if [ "$status" -eq 1 ]; then
            echo "::error::Example spec compliance failed - see the artifact below"
            exit 1
          fi
          echo "Compliance check finished with status $status"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-verification
          path: example-verification.md

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
