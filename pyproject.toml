[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-framework"
version = "2.1.0"
description = "🎓 LEAP (Learning Evolution & Adaptation Pipeline) - a model-agnostic agentic intelligent tutoring runtime exposed to host agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinger-lee", email = "209410338+Vinger-lee@users.noreply.github.com" }]
maintainers = [{ name = "Vinger-lee", email = "209410338+Vinger-lee@users.noreply.github.com" }]
keywords = ["llm", "agent", "tutoring", "mcp", "adaptive-learning", "knowledge-tracing", "fsrs", "ai-agent", "education", "intelligent-tutoring-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.3,<3",
    "fsrs>=5",
    "PyYAML>=6",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Needed only by scripts/verify_example_runtime.py, which drives a real browser
# to validate the front-end interaction contract.
examples = [
    "playwright>=1.40",
    "jsonschema>=4.0",
]

print = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/Vinger-lee/leap-framework"
Repository = "https://github.com/Vinger-lee/leap-framework"
Issues = "https://github.com/Vinger-lee/leap-framework/issues"
Changelog = "https://github.com/Vinger-lee/leap-framework/blob/main/CHANGELOG.md"

[project.scripts]
leap-mcp = "leap.server:main"
leap-doctor = "leap.doctor:main"
leap-print = "leap.printing:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# specs/, storage/ and config/ are data-only subdirectories, not packages. Keep
# namespace-package discovery off so they cannot shadow real modules and so a
# data directory never turns into an empty package entry in the wheel.
namespaces = false

[tool.setuptools.package-data]
# config/default.yaml is mirrored from the repository root (which stays the file
# developers edit) so an installed wheel keeps working configuration;
# tests/test_packaging.py asserts the two copies stay byte-identical.
leap = ["storage/*.sql", "specs/*.json", "specs/*.fragment", "config/*.yaml", "print_assets/*.css", "print_assets/*.js",
        "teaching_assets/*.css", "teaching_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
