name: CI

# Every branch and pull request runs the same checks a maintainer runs locally;
# see CONTRIBUTING.md for the manual sequence.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    name: Privacy & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository for secrets and PII
        run: |
          set +e
          python scripts/security_scan.py --root . \
            --md "$RUNNER_TEMP/security-scan.md" \
            --json "$RUNNER_TEMP/security-scan.json"
          status=$?
          set -e
          # 0 = clean, 1 = P0/P1 findings (fail the build), 2 = P2 only (reviewed,
          # tolerated like the static example warnings). Reports never touch the
          # checkout so they cannot break the teaching-repository gate.
          if [ "$status" -eq 1 ]; then
            echo "::error::P0/P1 privacy or secret findings - see the uploaded artifact"
            exit 1
          fi
          echo "Privacy scan finished with status $status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan
          path: |
            ${{ runner.temp }}/security-scan.md
            ${{ runner.temp }}/security-scan.json

  examples:
    name: Front-end example spec compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every example against the web spec
        run: |
          set +e
          python scripts/verify_example.py --all --md "$RUNNER_TEMP/example-verification.md"
          status=$?
          set -e
          # 0 = clean, 1 = errors (fail the build), 2 = warnings only (tolerated)
          if [ "$status" -eq 1 ]; then
            echo "::error::Example spec compliance failed - see the artifact below"
            exit 1
          fi
          echo "Compliance check finished with status $status"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-verification
          path: ${{ runner.temp }}/example-verification.md

  example-runtime:
    name: Repository gate, browser scenarios and real MCP bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,examples]"
      - run: python -m playwright install --with-deps chromium
      - name: Generated tool reference is current
        run: python scripts/generate_tool_reference.py --check
      - name: Installation self-check
        run: python -m leap.doctor
      - name: Generated drop-tower SVG is current
        run: python examples/04-physics-free-fall/build_figure.py --check
      - name: Obsidian links and canonical teaching pairs
        run: python scripts/verify_teaching_repository.py --json "$RUNNER_TEMP/teaching-verification.json"
      - name: Browser scenarios for every example
        run: python scripts/verify_example_runtime.py --all --json "$RUNNER_TEMP/runtime-verification.json"
      - name: Real page-to-MCP stdio bridge
        run: python scripts/verify_mcp_bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-verification
          path: |
            ${{ runner.temp }}/runtime-verification.json
            ${{ runner.temp }}/teaching-verification.json

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
